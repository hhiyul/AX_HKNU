server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 제한(2MB)보다 조금 크게 잡는다. 넘으면 백엔드에 닿기 전에 413
    client_max_body_size 3m;

    # 백엔드 컨테이너를 다시 만들어 IP가 바뀌어도 따라가도록 Docker DNS로 매번 찾는다.
    resolver 127.0.0.11 valid=10s;

    # AI 답변 진행 상황(SSE). 모아 보내지 않고 바로 흘려보내며, 긴 답변 중에 끊지 않는다.
    location ~ ^/api/projects/[^/]+/runs/[^/]+/stream$ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api/** 요청을 FastAPI 백엔드로 전달 (/api 접두사는 제거)
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router 등 SPA 라우팅: 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
