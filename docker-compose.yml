services:
  spring-gateway:
    build:
      context: ./gate
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      # 컨테이너 네트워크 안에서는 서비스 이름으로 접근
      BACKEND_URL: "${BACKEND_URL:-http://backend:8000}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  react-front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # 브라우저에서 호출하는 주소이므로 호스트 기준 게이트웨이 주소
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - spring-gateway
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 디버깅용 직접 접근 (평소엔 게이트웨이 /api 경유)
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MONGO_DETAILS: "${MONGO_DETAILS:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
