services:
  # 화면과 API의 입구. nginx가 /api/** 를 backend로 넘긴다 (front/nginx.conf).
  # gate/ 의 Spring 게이트웨이는 지금 쓰지 않는다.
  react-front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # 화면과 같은 주소의 /api 를 호출한다.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 디버깅용 직접 접근 (Swagger). 서버 안(127.0.0.1)에서만 열린다. 바깥에서는 react-front의 /api로만 들어온다.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      MONGO_DETAILS: "${MONGO_DETAILS:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-demo}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6-luna}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-}"
      AI_READ_ATTACHMENTS: "${AI_READ_ATTACHMENTS:-true}"
      AI_READ_IMAGES: "${AI_READ_IMAGES:-true}"
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
