spring.application.name=gate
server.port=${SERVER_PORT:8080}

# /api/** 요청을 FastAPI 백엔드로 전달 (/api 접두사는 제거)
spring.cloud.gateway.server.webflux.routes[0].id=backend
spring.cloud.gateway.server.webflux.routes[0].uri=${BACKEND_URL:http://localhost:8000}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGINS:http://localhost}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

management.endpoints.web.exposure.include=health
